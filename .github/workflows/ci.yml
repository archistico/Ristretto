# Verifiche C#/.NET 10. Nessun Python necessario.
# CI non qualifica mai l'inserimento reale o il desktop Windows.
name: Ristretto - audit C# e test headless
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  source:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Audit e test strumenti C#
        run: dotnet run -c Release --project tools/Ristretto.DevTools/Ristretto.DevTools.csproj -- gate source
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: source-gate-${{ github.run_id }}
          path: .local-cache/gates/source.json
          if-no-files-found: warn
          retention-days: 14
  headless-windows:
    needs: source
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      AVALONIA_TELEMETRY_OPTOUT: '1'
      DOTNET_NOLOGO: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: CI C# + xUnit + Node opzionale; prove desktop non eseguite
        run: dotnet run -c Release --project tools/Ristretto.DevTools/Ristretto.DevTools.csproj -- gate ci --restore-source online
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-headless-gate-${{ github.run_id }}
          path: |
            .local-cache/gates/ci.json
            .local-cache/gates/startup-cli.json
          if-no-files-found: warn
          retention-days: 14
